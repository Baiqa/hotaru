name: collect

# Сбор статей и первичная обработка: RSS -> сущности -> эмбеддинги -> события.
# Только расписание и ручной запуск (никаких pull_request: секреты не должны
# попадать в код, запускаемый из форков публичного репозитория).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Одна группа с merge/assign/split: все они пишут события, параллельно не гоняем.
concurrency:
  group: hotaru-events-writers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      # uv sync иногда падает на скачивании (8 ноября: 3 из ~15 запусков) — три попытки.
      - name: Install dependencies
        id: deps
        run: |
          for attempt in 1 2 3; do
            uv sync --frozen && exit 0
            echo "uv sync не удался (попытка $attempt/3)"; sleep 20
          done
          exit 1

      # Каждый следующий шаг идемпотентен и подбирает необработанное, поэтому
      # сбой одного шага не должен блокировать остальные (job всё равно станет красным).
      - name: Collect RSS
        run: uv run --frozen hotaru-collect
      - name: Extract entities
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run --frozen hotaru-extract-entities
      - name: Embed articles
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run --frozen hotaru-embed-articles
      - name: Cluster events
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run --frozen hotaru-cluster-events
