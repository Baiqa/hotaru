name: maintenance-daily

# Раз в сутки: разделение событий (§3.3), исторические ряды World Bank (§3.5),
# мониторинг пайплайна (§6). Gemini не используют.
# С 2026-11-12 расписание отключено: шаги этого файла выполняет единый
# .github/workflows/pipeline.yml. Файл оставлен только для ручного запуска как
# запасной вариант на время проверки нового конвейера; после суток стабильной
# работы pipeline.yml его нужно удалить (фаза 2 плана P0).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotaru-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      # uv sync иногда падает на скачивании (8 ноября: 3 из ~15 запусков) — три попытки.
      - name: Install dependencies
        id: deps
        run: |
          for attempt in 1 2 3; do
            uv sync --frozen && exit 0
            echo "uv sync не удался (попытка $attempt/3)"; sleep 20
          done
          exit 1

      - name: Split events
        run: uv run --frozen hotaru-split-events
      - name: Fetch World Bank series
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run --frozen hotaru-fetch-metrics
      - name: Pipeline monitoring
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run --frozen hotaru-monitor
