# Сущности, которые не заводим (фаза 4 плана P0, tmp/plans/p0-ispravleniya-posle-audita.md).
#
# Названия издательств, чьи статьи мы собираем (sources.yaml): в тексте РИА, ТАСС и
# Интерфакса они попадают в статью из служебных строк и подписей («МОСКВА, 9 ноя -
# РИА Новости.»), а не потому, что статья про само издание. Проверено 2026-11-15
# на окне 7 дней: «Риа Новости» — 2271 статья из 6321 русскоязычных, то есть общая
# сущность у трети потока — для кластеризации это шум, а не сигнал.
#
# Сравнение без учёта регистра, кавычки и пробелы по краям отбрасываются.
# BBC, Guardian, NPR и подобные сюда не входят: новость может быть про само издание
# (иск Трампа к BBC), а редкость такой сущности и так учтёт IDF-вес в scoring.py.

publishers:
  - "РИА Новости"
  - "РИА"
  - "Риа Новости"
  - "ТАСС"
  - "Интерфакс"
  - "INTERFAX.RU"
  - "Interfax"
  - "Sputnik"
  - "RIA Novosti"
  - "TASS"
